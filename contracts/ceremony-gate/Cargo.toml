[package]
name = "ceremony-gate"
description = "Accoryn ceremony gate: the only transfer approver for a Sputnik DAO, voting only after enough members attest to a fresh acoustic ceremony within amount tiers."
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
license = "MIT"
# NEP-0330 source metadata (exposed via `contract_source_metadata`).
repository = "https://github.com/anynomousfriend/Accoryn"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
